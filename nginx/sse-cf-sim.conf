# CloudFront read-timeout simulator
#
# Mimics CloudFront's "Origin Response Timeout" (60 s):
#   if no bytes arrive from the origin for 60 seconds the connection is dropped.
#
# Usage:
#   nginx -c $(pwd)/nginx/sse-cf-sim.conf
#   # or, if nginx is already running:
#   sudo cp nginx/sse-cf-sim.conf /etc/nginx/conf.d/
#   sudo nginx -s reload

# Needed when running nginx with -c (standalone, not as a service)
pid /tmp/nginx-sse-sim.pid;
events { worker_connections 1024; }

http {
    server {
        listen 9090;
        server_name localhost;

        location / {
            proxy_pass          http://localhost:8080;

            # ----------------------------------------------------------------
            # The key setting — equivalent to CloudFront "Origin Read Timeout"
            # Drop the connection if the origin sends no bytes for 60 seconds.
            # ----------------------------------------------------------------
            proxy_read_timeout  60s;

            # Required for SSE: disable response buffering so events are
            # flushed to the client immediately (CloudFront also disables
            # buffering for streaming responses).
            proxy_buffering     off;
            proxy_cache         off;

            # Keep the upstream connection alive (HTTP/1.1 persistent)
            proxy_http_version  1.1;
            proxy_set_header    Connection "";

            # Forward the original headers so Spring Boot CORS / session
            # cookie handling works correctly behind the proxy.
            proxy_set_header    Host              $host;
            proxy_set_header    X-Real-IP         $remote_addr;
            proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header    X-Forwarded-Proto $scheme;

            # Pass Origin through so Spring Boot's CORS filter sees
            # "http://localhost:4200" (the browser's origin via Vite).
            proxy_set_header    Origin            $http_origin;

            # Disable gzip on SSE streams — compressed chunked encoding
            # breaks the event-stream format.
            proxy_set_header    Accept-Encoding   "";
        }
    }
}
